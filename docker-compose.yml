version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisan_postgres
    environment:
      POSTGRES_DB: kisan_suvidha
      POSTGRES_USER: kisan_user
      POSTGRES_PASSWORD: kisan_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan_user -d kisan_suvidha"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kisan_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisan_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://kisan_user:kisan_secure_password_2026@postgres:5432/kisan_suvidha
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: sih_2026_kisan_suvidha_production_secret_key_change_in_prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-localhost:8000}
    container_name: kisan_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
